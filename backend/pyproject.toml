[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderfly-runtime"
version = "0.1.0"
description = "Optional input, output and file helpers for standalone SpiderFly tasks."
readme = "RUNTIME.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "openpyxl>=3.1.5,<4",
]

[tool.setuptools]
packages = ["spiderfly_runtime"]
include-package-data = false
