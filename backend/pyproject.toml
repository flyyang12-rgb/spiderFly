[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderfly-instructions"
version = "0.1.4"
description = "Reusable Python instructions and a small Excel workflow example."
readme = "INSTRUCTIONS.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "openpyxl>=3.1.5,<4",
]

[tool.setuptools]
packages = ["spiderfly_instructions", "example_flows"]
include-package-data = false
