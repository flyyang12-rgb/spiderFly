<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">SpiderFly：团队共享的 Python 自动化</title><desc id="desc">一台 Windows 承担执行，成员通过浏览器提交，任务按持久队列逐个运行并保存日志和结果。图为流程示意。</desc><rect x="0" y="0" width="1200" height="480" rx="24" fill="#e9f6ee" stroke="none"/><text x="56" y="63" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#00752e" >PYTHON AUTOMATION / SHARED WINDOWS HOST</text><text x="52" y="178" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="104" font-weight="700" fill="#123422" >SpiderFly</text><text x="56" y="244" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="40" font-weight="600" fill="#123422" >一台 Windows，团队共享。</text><text x="56" y="296" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#496652" >浏览器提交 · 任务排队 · 结果可下载</text><path d="M56 347 L1144 347" stroke="#b5d5bf" stroke-width="2" fill="none"/><text x="56" y="407" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="38" font-weight="600" fill="#00752e" >.py</text><path d="M147 395 L230 395" stroke="#009139" stroke-width="3" fill="none"/><text x="254" y="407" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="600" fill="#123422" >排队</text><path d="M340 395 L425 395" stroke="#009139" stroke-width="3" fill="none"/><rect x="449" y="371" width="190" height="49" rx="24" fill="#009139" stroke="none"/><text x="544" y="405" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">逐个执行</text><path d="M663 395 L751 395" stroke="#009139" stroke-width="3" fill="none"/><text x="781" y="407" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="600" fill="#123422" >日志 + 文件</text><text x="1143" y="451" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="400" fill="#496652" text-anchor="end">流程示意</text><rect x="980" y="80" width="160" height="160" rx="32" fill="#ffffff" stroke="none"/><circle cx="1034" cy="172" r="43" fill="#009139"/><circle cx="1060" cy="132" r="43" fill="#009139"/><circle cx="1090" cy="175" r="43" fill="#009139"/><rect x="992" y="259" width="147" height="8" rx="4" fill="#b5d5bf" stroke="none"/><rect x="1018" y="281" width="121" height="8" rx="4" fill="#b5d5bf" stroke="none"/></svg>