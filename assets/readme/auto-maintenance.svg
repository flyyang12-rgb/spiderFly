<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">SpiderFly 本机与远程任务的失败处理</title>
  <desc id="desc">本机任务失败后，AI 生成修复版并验证，通过后按配置启用，最多自动重跑一次。远程任务失败后，AI 生成未试跑候选，管理员确认后才启用，并在原电脑新建运行。两条流程都保留原失败记录。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#64816b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="640" rx="22" fill="#f5f7f4"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="52" y="72" font-size="43" font-weight="700" fill="#163b28">任务失败后如何处理</text>
    <text x="52" y="113" font-size="23" fill="#53685b">本机和远程任务采用不同的启用规则</text>
    <g id="local">
      <rect x="52" y="146" width="1096" height="192" rx="16" fill="#fff" stroke="#dce5dd"/>
      <rect x="52" y="146" width="8" height="192" rx="4" fill="#009139"/>
      <text x="80" y="187" font-size="28" font-weight="700" fill="#163b28">本机任务</text>
      <text x="80" y="217" font-size="19" fill="#53685b">旧单机兼容流程</text>
      <g font-size="21" font-weight="600" fill="#163b28" text-anchor="middle">
        <rect x="248" y="222" width="170" height="58" rx="10" fill="#e8f4eb"/><text x="333" y="258">失败或超时</text>
        <rect x="467" y="222" width="170" height="58" rx="10" fill="#e8f4eb"/><text x="552" y="258">生成修复版</text>
        <rect x="686" y="222" width="170" height="58" rx="10" fill="#e8f4eb"/><text x="771" y="258">验证并启用</text>
        <rect x="905" y="222" width="190" height="58" rx="10" fill="#163b28"/><text x="1000" y="258" fill="#fff">最多自动重跑一次</text>
      </g>
      <g fill="none" stroke="#64816b" stroke-width="3" marker-end="url(#arrow)"><path d="M425 251h34"/><path d="M644 251h34"/><path d="M863 251h34"/></g>
      <text x="248" y="311" font-size="19" fill="#53685b">只有验证通过且任务状态、预算允许时才启用和重跑。</text>
    </g>
    <g id="remote">
      <rect x="52" y="356" width="1096" height="192" rx="16" fill="#fff" stroke="#dce5dd"/>
      <rect x="52" y="356" width="8" height="192" rx="4" fill="#5b7f69"/>
      <text x="80" y="397" font-size="28" font-weight="700" fill="#163b28">远程任务</text>
      <text x="80" y="427" font-size="19" fill="#53685b">Windows Agent 流程</text>
      <g font-size="21" font-weight="600" fill="#163b28" text-anchor="middle">
        <rect x="248" y="432" width="170" height="58" rx="10" fill="#eef3ef"/><text x="333" y="468">失败或超时</text>
        <rect x="467" y="432" width="170" height="58" rx="10" fill="#eef3ef"/><text x="552" y="468">未试跑候选</text>
        <rect x="686" y="432" width="170" height="58" rx="10" fill="#eef3ef"/><text x="771" y="468">管理员确认</text>
        <rect x="905" y="432" width="190" height="58" rx="10" fill="#163b28"/><text x="1000" y="468" fill="#fff">在原电脑新建运行</text>
      </g>
      <g fill="none" stroke="#64816b" stroke-width="3" marker-end="url(#arrow)"><path d="M425 461h34"/><path d="M644 461h34"/><path d="M863 461h34"/></g>
      <text x="248" y="521" font-size="19" fill="#53685b">候选不会自动启用或运行；证据不足时可能只生成建议。</text>
    </g>
    <text x="52" y="600" font-size="22" fill="#53685b">两条流程都保留原失败记录；后续运行另记一条结果。</text>
  </g>
</svg>
