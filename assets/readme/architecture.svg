<text x="78" y="333" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="650" fill="#163b28">业务脚本</text>
<text x="78" y="380" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#647269">flows · 上传的 .py</text>
<text x="590" y="352" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="500" fill="#163b28">筛选、计算、采集规则</text>
