<text x="48" y="72" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="44" font-weight="700" fill="#163b28">三层职责，各自清楚。</text>
<text x="1152" y="72" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#647269" text-anchor="end">ARCHITECTURE</text>
<rect x="48" y="115" width="1104" height="140" rx="12" fill="#ffffff" stroke="none"/>
<rect x="48" y="115" width="6" height="140" rx="3" fill="#009139" stroke="none"/>
<text x="78" y="173" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="650" fill="#163b28">平台</text>
<text x="78" y="220" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#647269">backend/app · frontend/src</text>
<text x="590" y="192" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="500" fill="#163b28">账号、调度、环境、记录</text>
<rect x="48" y="275" width="1104" height="140" rx="12" fill="#ffffff" stroke="none"/>
